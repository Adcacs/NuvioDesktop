name: Build Windows fork with MAL sorting

on:
  workflow_dispatch:
  push:
    branches:
      - feat/library-mal-rating-sort

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Windows player runtime
        shell: pwsh
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Get-Item composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
          if ($runtime.Length -lt 1000000) { throw 'The MPV runtime is still a Git LFS pointer.' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Optional fork service configuration
        shell: pwsh
        env:
          FORK_LOCAL_PROPERTIES_BASE64: ${{ secrets.FORK_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if ($env:FORK_LOCAL_PROPERTIES_BASE64) {
            [IO.File]::WriteAllBytes((Join-Path $PWD 'local.properties'), [Convert]::FromBase64String($env:FORK_LOCAL_PROPERTIES_BASE64))
          } else {
            New-Item -ItemType File -Path 'local.properties' -Force | Out-Null
          }
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test library sorting and ratings
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:desktopTest `
            --tests '*LibraryDisplaySettingsTest' `
            --tests '*LibraryMalRatingsTest' `
            --tests '*LibraryCatalogStateTest' `
            --tests '*MdbListRatingsDecoderTest' `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-daemon --no-configuration-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows application
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:createDistributable `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            '-Pcompose.desktop.packaging.checkJdkVendor=false' `
            --no-daemon --no-configuration-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'composeApp/build/compose/binaries/main/app/Nuvio'
          if (-not (Test-Path -LiteralPath "$app/Nuvio.exe")) { throw 'Portable executable was not generated.' }
          Copy-Item -LiteralPath 'LICENSE' -Destination "$app/LICENSE.txt"
          Copy-Item -LiteralPath 'FORK-MAL.md' -Destination "$app/FORK-MAL.md"
      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Desktop-MAL-Portable-Windows
          path: composeApp/build/compose/binaries/main/app/Nuvio/
          if-no-files-found: error
      - name: Package Windows MSI
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            '-Pcompose.desktop.packaging.checkJdkVendor=false' `
            --no-daemon --no-configuration-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mal-sort-test-reports
          path: composeApp/build/reports/tests/desktopTest/
          if-no-files-found: warn
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Desktop-MAL-Windows
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error

